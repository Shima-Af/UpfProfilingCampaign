# UPF activation cost — measurement provenance and scaling rule
# This file holds RAW MEASUREMENTS from a colleague's machine.
# Do not edit values; they are anchors for the scaling rule below.

source:
  description: "UPF activation cost from RAPL package-0 measurements (100 iterations each)"
  reports:
    dpdk: "BESS_UPF report  (2026-02-23) — command: scripts/docker_setup_mellanox.sh"
    usr:  "OAI_UPF  report  (2026-02-26) — command: docker compose up"
  source_machine_baseline_w:
    dpdk: 20.080
    usr:  19.908
  notes: |
    Different machine than the surrogate's profiling host, and measured at
    PACKAGE (whole-socket RAPL) scope, whereas the surrogate is PER-PROCESS
    (Scaphandre) attributed power. Absolute Wh therefore do NOT transfer. Two
    dimensionless / stack-level quantities do transfer:
      1. Activation duration (seconds) — a software-stack property (driver
         init, container boot), independent of the host's power scale.
      2. The burst ratio k = net_activation_power / idle_baseline_power — how
         many times its own idle draw the machine pulls DURING activation.
    Note: activation happens at ZERO traffic (the new UPF is not serving yet),
    so the switching cost is a per-variant CONSTANT and must NOT depend on the
    current serving load. The earlier "steady_state_power × activation_s" rule
    was wrong on both counts: it used loaded (not zero-traffic) power, and it
    mislabelled the source's net *burst* power as "steady_state".

# === Used by the model =====================================================
# Hardware-independent: activation duration in seconds.
activation_duration_s:
  dpdk: 24.0
  usr:   3.3

# === Reference only (validates the scaling rule) ===========================
# Net energy spike measured on the source machine, used to verify that
# spike_wh ≈ net_power_W × activation_s holds in the data.
source_measured:
  dpdk:
    net_power_w:        34.810   # mean RAPL net (above baseline)
    activation_s:       24.0
    spike_wh_measured:   0.232    # 34.81 × 24 / 3600 ≈ 0.232 ✓
  usr:
    net_power_w:         7.451
    activation_s:        3.3
    spike_wh_measured:   0.007    # 7.45 × 3.3 / 3600 ≈ 0.0068 ✓

# === Calibrated switching energy (attributed scale, load-independent) =======
# Derivation (rebased-burst calibration):
#
#   k[variant]        = net_activation_power_w / source_baseline_w   (source machine, dimensionless)
#   spike_wh[variant] = k · idle_power_attributed_w · activation_s / 3600
#
# The portable burst ratio k is measured on the source machine; it is then
# rebased onto THIS deployment's per-process idle power (from the profiling
# params snapshot). Load L does not appear — activation is a zero-traffic event.
#
#   k_dpdk = 34.810 / 20.080 = 1.7336
#   k_usr  =  7.451 / 19.908 = 0.3743
#   idle_power_attributed_w: dpdk 0.82, usr 0.015   (profiling params.yaml operating_ranges)
#
#   spike_wh_dpdk = 1.7336 · 0.82   · 24.0/3600 = 0.009476 Wh
#   spike_wh_usr  = 0.3743 · 0.015  ·  3.3/3600 = 0.00000515 Wh
#
# Asymmetry (DPDK ≫ USR, ~1800×) is preserved: DPDK activation is a long,
# CPU-heavy driver/hugepage init; USR is a short container start. This is the
# quantity consumed by the twin (digital_twin.py compute_step).
calibration:
  burst_ratio_k:                 # dimensionless, source machine
    dpdk: 1.7336
    usr:  0.3743
  idle_power_attributed_w:       # this deployment, per-process (Scaphandre)
    dpdk: 0.82
    usr:  0.015
  spike_wh:                      # result: constant per variant, load-independent
    dpdk: 0.009476
    usr:  0.00000515
