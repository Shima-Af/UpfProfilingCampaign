# dvc.yaml — Pipeline definition.
# Each stage declares its command, dependencies, parameters, and outputs.
# DVC builds a DAG from this and only re-runs stages whose inputs changed.

stages:
  ingest:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - configs/file_manifest.json
      - data/raw/loadcore
      - data/raw/scaphandre
    params:
      - ingest
    outs:
      - data/interim/loadcore
      - data/interim/scaphandre
      - data/interim/discovery.json

  merge:
    cmd: python src/merge.py
    deps:
      - src/merge.py
      - data/interim/loadcore
      - data/interim/scaphandre
      - data/interim/discovery.json
      - data/raw/scaphandre
    params:
      - merge
    outs:
      - data/interim/merged.csv:
          persist: true

  featurize:
    cmd: python src/features.py
    deps:
      - src/features.py
      - data/interim/merged.csv
    params:
      - features
    outs:
      - data/processed/features.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/features.csv
    params:
      - train
    outs:
      - models/
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/
      - data/processed/features.csv
    params:
      - train
    plots:
      - reports/figures/fig8_predicted_vs_actual.png:
          cache: false
      - reports/figures/fig9_r2_heatmap.png:
          cache: false
      - reports/figures/fig10_algo_comparison_l2.png:
          cache: false
      - reports/figures/fig11_algo_comparison_l1.png:
          cache: false
      - reports/figures/fig12_interpretability.png:
          cache: false
      - reports/figures/fig13_variant_summary.png:
          cache: false
