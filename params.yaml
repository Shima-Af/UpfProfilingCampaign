# params.yaml — Single source of truth for all pipeline parameters.
# Both DVC and your Python scripts read from here.
# Change a value, run `dvc repro`, and only affected stages re-run.

ingest:
  manifest_path: configs/file_manifest.json
  loadcore_zip_dir: data/raw/loadcore
  scaphandre_csv_dir: data/raw/scaphandre
  output_dir: data/interim

merge:
  time_alignment_tolerance_sec: 3
  interim_dir: data/interim
  raw_scaphandre_dir: data/raw/scaphandre
  scaphandre_mapping:
    sd_core_dpdk: dpdk
    oai_userspaceapplication: usr

features:
  rolling_window_sec: 30
  target: sec_total               # "sec_total", "sec_net", "power_watts", or "net_power_watts"
  features_output: data/processed/features.csv

train:
  target: power_watts
  test_split: 0.2
  random_state: 42
  usr_safe_threshold_gbps: 0.5   # samples above this are "saturated"
  cv_folds: 5
  search_n_iter: 20              # RandomizedSearchCV iterations for RF/GBM

  models:
    - ridge
    - random_forest
    - gradient_boosting

  # Layer 1 — targets predicted from offered-load inputs
  layer1_targets:
    - throughput_gbps
    - cpu_pct
    - gtpu_packets_dn__packets_lost_delta
    - downlink_one_way_delay_distribution__weighted_mean_delay_us

  # Offered-load features (TX side) — inputs to both L1 and L2
  layer1_features:
    - gtpu_kbitss_dn__kbits_tx_s
    - gtpu_kbitss_ngran__gtpu_kbits_tx_s
    - gtpu_packets_dn__packets_tx_delta
    - gtpu_packets_ngran__gtpu_packets_tx_delta
    - user_plane_throughput__l2_3_device_tx_traffic
    - avg_packet_size_bytes
    - l2l3_overhead_ratio

  # Lite model: throughput-only inputs (NetMob compatible)
  lite_features:
    - gtpu_kbitss_dn__kbits_tx_s
    - gtpu_kbitss_ngran__gtpu_kbits_tx_s

  # NetMob adapter defaults
  adapter:
    c_max_dl_gbps: 10.0
    c_max_ul_gbps: 10.0
    avg_packet_size_bytes: 1250
    interval_sec: 3

  # Columns that must never be used as features (leakage / derived from target)
  leakage_cols:
    - power_watts
    - net_power_watts
    - sec_total
    - sec_net
    - power_watts_roll_mean_30s
    - power_watts_roll_std_30s
    - power_watts_roll_max_30s
    - cpu_per_watt
    - idle_cpu_pct
    - is_dpdk

evaluate:
  metrics_output: reports/metrics.json
